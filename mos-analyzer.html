<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoS Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0d10;--pn:#14161b;--ln:#252932;--tx:#d9dde5;--mu:#7b8493;--ac:#7b6cf0;--ok:#a6d94e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:270px 1fr 300px;gap:10px;height:100%;padding:10px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;overflow:auto}
h3{margin:0 0 8px;font-size:13px;font-weight:600}
.sec{margin-bottom:18px}
.mod{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--tx);padding:7px 9px;border-radius:6px;font:inherit;cursor:pointer}
.mod:hover{background:#1b1e25}.mod.on{background:#211e3d;border-color:var(--ac)}
.mod:disabled{color:var(--mu);cursor:default;background:none}
.row{margin:9px 0}.row label{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:3px}.row label b{color:var(--tx);font-weight:500}
input[type=range]{width:100%;accent-color:var(--ac)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;background:#1b1e25;border:1px solid var(--ln);color:var(--tx);padding:6px 4px;border-radius:6px;font:inherit;cursor:pointer;min-width:42px}
.seg button.on{background:#211e3d;border-color:var(--ac)}
.btn{width:100%;margin-top:6px;background:#1b1e25;border:1px solid var(--ln);color:var(--tx);padding:7px;border-radius:6px;font:inherit;cursor:pointer}
#mid{display:flex;flex-direction:column;gap:8px;min-width:0}
#tabs{display:flex;gap:4px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px}
#tabs button{flex:1;background:none;border:0;color:var(--mu);padding:7px;border-radius:7px;font:inherit;cursor:pointer}
#tabs button.on{background:#262a33;color:var(--tx)}
#stage{position:relative;flex:1;min-height:0;background:var(--pn);border:1px solid var(--ln);border-radius:10px}
canvas{display:block;width:100%;height:100%}
#leg{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px}
#bar{flex:1;height:10px;border-radius:5px}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1d2028}.kv span:first-child{color:var(--mu)}
.note{color:var(--mu);font-size:12px;margin:6px 0}
#hint{position:absolute;left:12px;bottom:10px;color:var(--mu);font-size:12px;pointer-events:none}
@media(max-width:900px){#app{grid-template-columns:1fr;height:auto}#stage{height:60vh;flex:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script></head><body>
<div id="app">
 <div class="pn" id="L"></div>
 <div id="mid"><div id="tabs"></div><div id="stage"><canvas id="cv"></canvas><canvas id="gl" style="display:none"></canvas><div id="hint"></div></div><div id="leg"></div></div>
 <div class="pn" id="R"></div>
</div>
<script>
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d');
const NX=24,NY=8, XS=[-1,1,1,-1], YS=[-1,-1,1,1];
const P={L:200,H:40,t:10,E:200000,nu:.3,anchor:'left',F:500,dir:[0,-1],def:40,field:'vm'};
const M={sx:80,sy:-20,txy:40,th:0};
let mod='cant',forces=[],S=null,hn=null,he=null,geo={};
const fmt=v=>Math.abs(v)>=100?v.toFixed(1):Math.abs(v)>=1?v.toFixed(2):v.toFixed(3);
const stops=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
const cmap=t=>{t=Math.max(0,Math.min(1,t))*4;const i=Math.min(3,t|0),f=t-i,a=stops[i],b=stops[i+1];return`rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f))})`};
document.querySelector('#bar')||0;

// ---------- FEM: bilinear Q4, plane stress ----------
function Bm(x,y,a,b){const B=[0,1,2].map(()=>new Array(8).fill(0));
 for(let i=0;i<4;i++){const dx=XS[i]*(1+YS[i]*y)/4/a,dy=YS[i]*(1+XS[i]*x)/4/b;B[0][2*i]=dx;B[1][2*i+1]=dy;B[2][2*i]=dy;B[2][2*i+1]=dx}return B}
function solve(){
 const a=P.L/NX/2,b=P.H/NY/2,c=P.E/(1-P.nu**2),D=[[c,c*P.nu,0],[c*P.nu,c,0],[0,0,c*(1-P.nu)/2]],g=1/Math.sqrt(3);
 const K=Array.from({length:8},()=>new Array(8).fill(0));
 for(const gx of[-g,g])for(const gy of[-g,g]){const B=Bm(gx,gy,a,b);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){let s=0;for(let k=0;k<3;k++)for(let l=0;l<3;l++)s+=B[k][i]*D[k][l]*B[l][j];K[i][j]+=s*a*b*P.t}}
 const W=NX+1,nn=W*(NY+1),nd=2*nn,Kg=new Float64Array(nd*nd),en=[];
 for(let ey=0;ey<NY;ey++)for(let ex=0;ex<NX;ex++){const n0=ex+ey*W,n=[n0,n0+1,n0+W+1,n0+W];en.push(n);
  const d=n.flatMap(k=>[2*k,2*k+1]);for(let i=0;i<8;i++)for(let j=0;j<8;j++)Kg[d[i]*nd+d[j]]+=K[i][j]}
 const fixed=new Uint8Array(nd);
 for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){const f={left:i==0,right:i==NX,bottom:j==0,top:j==NY}[P.anchor];if(f){fixed[2*(i+j*W)]=1;fixed[2*(i+j*W)+1]=1}}
 const fr=[];for(let k=0;k<nd;k++)if(!fixed[k])fr.push(k);
 const m=fr.length,A=new Float64Array(m*m),f=new Float64Array(m),pos=new Int32Array(nd).fill(-1);fr.forEach((k,i)=>pos[k]=i);
 for(let i=0;i<m;i++)for(let j=0;j<m;j++)A[i*m+j]=Kg[fr[i]*nd+fr[j]];
 for(const q of forces){if(pos[2*q.n]>=0)f[pos[2*q.n]]+=q.fx;if(pos[2*q.n+1]>=0)f[pos[2*q.n+1]]+=q.fy}
 for(let k=0;k<m;k++){const p=A[k*m+k];for(let i=k+1;i<m;i++){const r=A[i*m+k]/p;if(!r)continue;for(let j=k;j<m;j++)A[i*m+j]-=r*A[k*m+j];f[i]-=r*f[k]}}
 const x=new Float64Array(m);for(let i=m-1;i>=0;i--){let s=f[i];for(let j=i+1;j<m;j++)s-=A[i*m+j]*x[j];x[i]=s/A[i*m+i]}
 const u=new Float64Array(nd);fr.forEach((k,i)=>u[k]=x[i]);
 const B0=Bm(0,0,a,b),el=en.map(n=>{const ue=n.flatMap(k=>[u[2*k],u[2*k+1]]),e=B0.map(r=>r.reduce((s,v,i)=>s+v*ue[i],0)),
  s=D.map(r=>r.reduce((q,v,i)=>q+v*e[i],0)),[sx,sy,tx]=s,av=(sx+sy)/2,R=Math.hypot((sx-sy)/2,tx);
  return{n,e,sx,sy,tx,vm:Math.sqrt(sx*sx-sx*sy+sy*sy+3*tx*tx),s1:av+R,s2:av-R,R,av,thp:.5*Math.atan2(2*tx,sx-sy)*180/Math.PI,
   um:n.reduce((q,k)=>q+Math.hypot(u[2*k],u[2*k+1]),0)/4}});
 S={u,el,fixed,W};
}
// ---------- drawing ----------
function size(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!=w*r||cv.height!=h*r){cv.width=w*r;cv.height=h*r}ctx.setTransform(r,0,0,r,0,0);return[w,h]}
function pt(i,j,def){const k=i+j*(NX+1),x=i*P.L/NX,y=j*P.H/NY,u=S?S.u[2*k]*def:0,v=S?S.u[2*k+1]*def:0;return[geo.ox+(x+u)*geo.s,geo.oy-(y+v)*geo.s]}
function drawBeam(){
 const[w,h]=size();ctx.clearRect(0,0,w,h);
 geo.s=Math.min(w*.78/P.L,h*.6/P.H);geo.ox=(w-P.L*geo.s)/2;geo.oy=h/2+P.H*geo.s/2;
 const F=P.field,vals=S.el.map(e=>F=='u'?e.um:e[F]);let lo=Math.min(...vals),hi=Math.max(...vals);if(F=='vm'||F=='u')lo=Math.min(lo,0);if(hi-lo<1e-9)hi=lo+1;
 S.el.forEach((e,q)=>{const i=q%NX,j=(q/NX)|0,ps=[pt(i,j,P.def),pt(i+1,j,P.def),pt(i+1,j+1,P.def),pt(i,j+1,P.def)];
  ctx.beginPath();ps.forEach((p,k)=>k?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=cmap((vals[q]-lo)/(hi-lo));ctx.fill();
  ctx.strokeStyle=q===he?'#fff':'rgba(0,0,0,.28)';ctx.lineWidth=q===he?2:1;ctx.stroke()});
 // nodes + anchors
 for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){const k=i+j*(NX+1),p=pt(i,j,P.def);
  if(S.fixed[2*k]){ctx.fillStyle='#e5484d';ctx.fillRect(p[0]-3,p[1]-3,6,6)}
  else{ctx.beginPath();ctx.arc(p[0],p[1],k===hn?5:2,0,7);ctx.fillStyle=k===hn?'#fff':'rgba(255,255,255,.35)';ctx.fill()}}
 // forces
 for(const q of forces){const i=q.n%(NX+1),j=(q.n/(NX+1))|0,p=pt(i,j,P.def),m=Math.hypot(q.fx,q.fy),dx=q.fx/m,dy=-q.fy/m,L=38;
  const x0=p[0]-dx*L,y0=p[1]-dy*L;ctx.strokeStyle=ctx.fillStyle='#ff9f43';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(...p);ctx.stroke();
  ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(p[0]-dx*9-dy*5,p[1]-dy*9+dx*5);ctx.lineTo(p[0]-dx*9+dy*5,p[1]-dy*9-dx*5);ctx.fill();
  ctx.font='11px IBM Plex Sans';ctx.fillText(fmt(m)+' N',x0+(dx<0?6:-30),y0-6)}
 const u=F=='u'?'mm':'MPa';$('#leg').innerHTML=`<span>${fmt(lo)}</span><div id="bar" style="background:linear-gradient(90deg,${[0,.25,.5,.75,1].map(t=>cmap(t)).join(',')})"></div><span>${fmt(hi)} ${u}</span>`;
}
function drawMohr(c,w,h,sx,sy,tx,th){
 c.clearRect(0,0,w,h);const av=(sx+sy)/2,d=(sx-sy)/2,R=Math.hypot(d,tx),s=Math.min(w*.42/(R+Math.abs(av)+1),h*.4/(R+1)),x0=w/2-av*s,y0=h/2,X=v=>x0+v*s,Y=v=>y0+v*s;
 c.strokeStyle='#3a3f4b';c.lineWidth=1;c.beginPath();c.moveTo(8,y0);c.lineTo(w-8,y0);c.moveTo(x0,8);c.lineTo(x0,h-8);c.stroke();
 c.fillStyle='#7b8493';c.font='11px IBM Plex Sans';c.fillText('σ',w-16,y0-5);c.fillText('τ (down +)',x0+5,16);
 c.strokeStyle='#7b6cf0';c.lineWidth=2;c.beginPath();c.arc(X(av),y0,R*s,0,7);c.stroke();
 const t=th*Math.PI/90,c2=Math.cos(t),s2=Math.sin(t),a1=av+d*c2+tx*s2,a2=av-d*c2-tx*s2,tt=-d*s2+tx*c2;
 const dot=(px,py,col,l)=>{c.fillStyle=col;c.beginPath();c.arc(X(px),Y(py),4,0,7);c.fill();c.fillText(l,X(px)+6,Y(py)-6)};
 c.strokeStyle='#cfd3dc';c.lineWidth=1;c.beginPath();c.moveTo(X(a1),Y(tt));c.lineTo(X(a2),Y(-tt));c.stroke();
 dot(av+R,0,'#a6d94e','σ1');dot(av-R,0,'#a6d94e','σ2');dot(a1,tt,'#ff9f43',"x'");dot(a2,-tt,'#ff9f43',"y'");
 return{a1,a2,tt,R,av};
}
// ---------- UI ----------
const MODS=[['cant','Cantilever 2D (plane stress)'],['3d','Cantilever 3D (hex8)'],['mohr',"Mohr's circle"],['',"Axial bar"],['',"Truss"]];
function slider(l,k,o,min,max,st,u,cb){const r=document.createElement('div');r.className='row';
 r.innerHTML=`<label>${l}<b>${o[k]} ${u}</b></label><input type=range min=${min} max=${max} step=${st} value=${o[k]}>`;
 r.querySelector('input').oninput=e=>{o[k]=+e.target.value;r.querySelector('b').textContent=o[k]+' '+u;cb()};return r}
function seg(opts,cur,cb){const d=document.createElement('div');d.className='seg';
 opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=String(cur())==String(v)?'on':'';b.onclick=()=>{cb(v);[...d.children].forEach(x=>x.className='');b.className='on'};d.append(b)});return d}
function left(){const L=$('#L');L.innerHTML='<div class="sec"><h3>Modules</h3></div>';
 MODS.forEach(([id,n])=>{const b=document.createElement('button');b.className='mod'+(id==mod?' on':'');b.textContent=n+(id?'':' (planned)');b.disabled=!id;b.onclick=()=>{mod=id;he=hn=null;left();tabs();run()};L.firstChild.append(b)});
 const p=document.createElement('div');p.className='sec';L.append(p);
 if(mod=='cant'){p.innerHTML='<h3>Geometry & material</h3>';
  p.append(slider('Length','L',P,100,400,10,'mm',run),slider('Depth','H',P,10,100,2,'mm',run),slider('Thickness','t',P,2,40,1,'mm',run),slider('Young’s modulus','E',P,1000,300000,1000,'MPa',run),slider('Poisson ratio','nu',P,0.05,0.45,0.01,'',run));
  p.insertAdjacentHTML('beforeend','<h3 style="margin-top:16px">Anchor (fixed edge)</h3>');
  p.append(seg([['left','Left'],['right','Right'],['top','Top'],['bottom','Bottom']],()=>P.anchor,v=>{P.anchor=v;run()}));
  p.insertAdjacentHTML('beforeend','<h3 style="margin-top:16px">Load</h3>');
  p.append(seg([['0,1','↑'],['0,-1','↓'],['-1,0','←'],['1,0','→']],()=>P.dir.join(','),v=>P.dir=v.split(',').map(Number)));
  p.append(slider('Force per click','F',P,50,5000,50,'N',()=>{}),slider('Deformation scale','def',P,1,300,1,'×',draw));
  const b=document.createElement('button');b.className='btn';b.textContent='Clear loads';b.onclick=()=>{forces=[];run()};p.append(b);
  p.insertAdjacentHTML('beforeend','<p class="note">Plane stress, Q4 elements, mm–N–MPa. Click a node to add a force; right-click to remove.</p>');
 }else if(mod=='3d'){left3(p)}else{p.innerHTML='<h3>Stress state</h3>';
  p.append(slider('σx','sx',M,-200,200,1,'MPa',run),slider('σy','sy',M,-200,200,1,'MPa',run),slider('τxy','txy',M,-150,150,1,'MPa',run),slider('Plane angle θ','th',M,-90,90,1,'°',run));}
}
function tabs(){const T=$('#tabs');T.innerHTML='';
 if(mod!='cant'&&mod!='3d'){T.style.display='none';return}T.style.display='flex';
 const O=mod=='3d'?Q:P;(mod=='3d'?[['vm','von Mises'],['sx','σxx'],['sy','σyy'],['sz','σzz'],['u','Displacement']]:[['vm','von Mises'],['sx','σx'],['sy','σy'],['tx','τxy'],['u','Displacement']]).forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=O.field==k?'on':'';b.onclick=()=>{O.field=k;tabs();draw()};T.append(b)})}
function right(){const R=$('#R'),kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`;
 if(mod=='3d'){right3(R,kv);return}
 if(mod=='cant'){const el=S.el,top=el.reduce((a,b)=>b.vm>a.vm?b:a),sel=he!=null?el[he]:top,ti=el.indexOf(top),umax=Math.max(...[...Array((NX+1)*(NY+1)).keys()].map(k=>Math.hypot(S.u[2*k],S.u[2*k+1])));
  R.innerHTML=`<div class="sec"><h3>Summary</h3>${kv('Loads applied',forces.length)}${kv('Max von Mises',fmt(top.vm)+' MPa')}${kv('Max |σx|',fmt(Math.max(...el.map(e=>Math.abs(e.sx))))+' MPa')}${kv('Max displacement',fmt(umax)+' mm')}
  <p class="note">${forces.length?`Peak von Mises sits in element column ${ti%NX+1}/${NX}, row ${((ti/NX)|0)+1}/${NY} (from bottom-left).`:'No loads yet — click nodes in the plot.'}</p></div>
  <div class="sec"><h3>${he!=null?'Hovered element':'Peak-stress element'}</h3>${kv('σx / σy / τxy',[sel.sx,sel.sy,sel.tx].map(fmt).join(' / '))}${kv('εx / εy / γxy (×10⁻⁶)',sel.e.map(v=>(v*1e6).toFixed(0)).join(' / '))}${kv('σ1 / σ2',fmt(sel.s1)+' / '+fmt(sel.s2))}${kv('τmax',fmt(sel.R))}${kv('θp',sel.thp.toFixed(1)+'°')}${kv('von Mises',fmt(sel.vm))}
  <canvas id="mc" style="height:170px;margin-top:8px"></canvas></div>`;
  const c=$('#mc'),r=devicePixelRatio||1;c.width=c.clientWidth*r;c.height=170*r;const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);drawMohr(x,c.clientWidth,170,sel.sx,sel.sy,sel.tx,0);
 }else{const av=(M.sx+M.sy)/2,Rr=Math.hypot((M.sx-M.sy)/2,M.txy);
  R.innerHTML=`<div class="sec"><h3>Principal state</h3>${kv('σ1',fmt(av+Rr)+' MPa')}${kv('σ2',fmt(av-Rr)+' MPa')}${kv('τmax',fmt(Rr)+' MPa')}${kv('θp',(.5*Math.atan2(2*M.txy,M.sx-M.sy)*180/Math.PI).toFixed(1)+'°')}${kv('Centre',fmt(av)+' MPa')}</div><div class="sec" id="tr"><h3>Rotated plane (θ = ${M.th}°)</h3></div>`}
}
function hint(){$('#hint').textContent=mod=='3d'?'Drag: orbit · Wheel: zoom · Click a surface node: force · Shift+click: remove':mod=='cant'?'Click a node: apply force · Right-click: remove · Hover: element tensor':"Drag the sliders — the orange line is the plane rotated by θ"}
function draw(){
 cv.style.display=mod=='3d'?'none':'block';$('#gl').style.display=mod=='3d'?'block':'none';
 if(mod=='3d'){draw3();right()}
 else if(mod=='cant'){drawBeam();right()}
 else{const[w,h]=size(),o=drawMohr(ctx,w,h,M.sx,M.sy,M.txy,M.th);right();
  $('#tr').insertAdjacentHTML('beforeend',`<div class="kv"><span>σx'</span><span>${fmt(o.a1)} MPa</span></div><div class="kv"><span>σy'</span><span>${fmt(o.a2)} MPa</span></div><div class="kv"><span>τx'y'</span><span>${fmt(o.tt)} MPa</span></div>`);
  $('#leg').innerHTML='';}
 hint()}
function run(){if(mod=='cant')solve();if(mod=='3d')solve3();draw()}
// ---------- interaction ----------
function pick(ev){const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;let bn=null,bd=11,be=null,ed=1e9;
 for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){const p=pt(i,j,P.def),d=Math.hypot(p[0]-mx,p[1]-my);if(d<bd){bd=d;bn=i+j*(NX+1)}}
 S.el.forEach((e,q)=>{const i=q%NX,j=(q/NX)|0,a=pt(i,j,P.def),b=pt(i+1,j+1,P.def),d=Math.hypot((a[0]+b[0])/2-mx,(a[1]+b[1])/2-my);if(d<ed){ed=d;be=q}});
 return{bn,be:ed<geo.s*P.L/NX*1.2?be:null}}
cv.onmousemove=e=>{if(mod!='cant')return;const p=pick(e);if(p.bn!==hn||p.be!==he){hn=p.bn;he=p.be;draw()}};
cv.onclick=e=>{if(mod!='cant')return;const{bn}=pick(e);if(bn==null||S.fixed[2*bn])return;
 const[dx,dy]=P.dir,q=forces.find(f=>f.n==bn);if(q){q.fx+=dx*P.F;q.fy+=dy*P.F;if(!q.fx&&!q.fy)forces.splice(forces.indexOf(q),1)}else forces.push({n:bn,fx:dx*P.F,fy:dy*P.F});run()};
cv.oncontextmenu=e=>{e.preventDefault();if(mod!='cant')return;const{bn}=pick(e);forces=forces.filter(f=>f.n!=bn);run()};
addEventListener('resize',draw);
left();tabs();forces=[{n:NX+(NY)*(NX+1),fx:0,fy:-800}];run();
</script><script>
// ---------- 3D: hex8 solid cantilever, matrix-free PCG ----------
const Q={L:240,H:40,W:40,E:200000,nu:.3,anchor:'left',F:500,dir:[0,-1,0],def:40,field:'vm'};
const NX3=12,NY3=4,NZ3=4,W3=NX3+1,V3=W3*(NY3+1),NN3=V3*(NZ3+1);
const HX=[-1,1,1,-1,-1,1,1,-1],HY=[-1,-1,1,1,-1,-1,1,1],HZ=[-1,-1,-1,-1,1,1,1,1];
const FACES=[[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[0,4,7,3],[1,2,6,5]],NB=[[0,0,-1],[0,0,1],[0,-1,0],[0,1,0],[-1,0,0],[1,0,0]];
const id3=(i,j,k)=>i+W3*(j+(NY3+1)*k);
