[workspace]
name = "mos-analyzer"
version = "0.2.0"
description = "3D linear-elastic FEM studio and Learning Lab with Computer Vision 3D reconstruction"
authors = ["Srijan <srijan@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
app = "python -m mos.app --server --port 8080"
test = "pytest -q"
smoke = "python tools/smoke_app.py"

[dependencies]
python = ">=3.11,<3.12"

[pypi-dependencies]
numpy = ">=1.24"
scipy = ">=1.12"
scikit-fem = ">=8.0"
meshio = ">=5.0"
pillow = ">=10.0"
pytest = "*"
pyvista = ">=0.43"
trame = ">=3.0"
trame-vtk = "*"
trame-vuetify = "*"
trame-pyvista = "*"
gmsh = ">=4.11"
transformers = ">=4.45"
torch = ">=2.0"
torchvision = ">=0.15"
opencv-contrib-python-headless = "*"
scikit-image = ">=0.22"
